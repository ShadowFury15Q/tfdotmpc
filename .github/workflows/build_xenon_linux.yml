name: Build patched XenonRecomp (Linux, local DOTM test)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build_xenon_linux.yml'

permissions:
  contents: read

jobs:
  linux_tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build patched recompilation tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 ninja-build cmake
          git clone --depth 1 --recurse-submodules https://github.com/hedge-dev/XenonRecomp.git XenonRecomp
          python3 scripts/apply_xenon_patch.py XenonRecomp
          cmake -S XenonRecomp -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build-linux --parallel 4
          mkdir -p dist/bin
          find build-linux -type f -name 'XenonRecomp' -executable -exec cp {} dist/bin/XenonRecomp \;
          find build-linux -type f -name 'XenonAnalyse' -executable -exec cp {} dist/bin/XenonAnalyse \;
          find XenonRecomp -type f -name 'ppc_context.h' -exec cp {} dist/bin/ppc_context.h \; -quit
          test -s dist/bin/XenonRecomp
          test -s dist/bin/ppc_context.h
          chmod +x dist/bin/XenonRecomp
          tar -czf dist/DOTM_XenonRecomp_Linux.tar.gz -C dist/bin .
      - name: Upload portable tools for offline private-XEX testing
        uses: actions/upload-artifact@v4
        with:
          name: DOTM-XenonRecomp-Linux
          path: dist/DOTM_XenonRecomp_Linux.tar.gz
          if-no-files-found: error
