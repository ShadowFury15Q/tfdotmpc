name: Test DOTM native runtime (Windows + Linux)

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'scripts/private_ppc_preflight.py'
      - 'scripts/test_private_ppc_preflight.py'
      - 'scripts/prepare_private_boot.py'
      - 'scripts/test_prepare_private_boot.py'
      - '.github/workflows/test_dotm_native_runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Enable Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Configure runtime
        shell: pwsh
        run: |
          if ($IsWindows -or $env:RUNNER_OS -eq 'Windows') {
            cmake -S native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang-cl
          } else {
            cmake -S native -B native-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
          }
          if ($LASTEXITCODE -ne 0) { throw "Configure failed" }
      - name: Build runtime
        shell: pwsh
        run: |
          cmake --build native-build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
      - name: Run host unit tests
        shell: pwsh
        run: |
          ctest --test-dir native-build --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "Native runtime tests failed" }

      - name: Test private link stub generator (synthetic sources only)
        shell: pwsh
        run: |
          python native/test_generate_private_link_stubs.py
          if ($LASTEXITCODE -ne 0) { throw "Private link stub generator tests failed" }

      - name: Validate private PPC preflight (synthetic fixtures only)
        shell: pwsh
        run: |
          python scripts/test_private_ppc_preflight.py
          if ($LASTEXITCODE -ne 0) { throw "Private PPC preflight tests failed" }

      - name: Test original private XEX/PE preparation (no game assets)
        shell: pwsh
        run: |
          python scripts/test_prepare_private_boot.py
          if ($LASTEXITCODE -ne 0) { throw "Private original title preparation tests failed" }

      - name: Upload native diagnostic binaries (no game files)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DOTM-Native-Diagnostics-${{ matrix.os }}
          path: |
            native-build/dotm_ue3_probe
            native-build/dotm_ue3_probe.exe
            native-build/dotm_dds_export
            native-build/dotm_dds_export.exe
            native-build/dotm_mesh_probe
            native-build/dotm_mesh_probe.exe
            native-build/dotm_static_obj_export
            native-build/dotm_static_obj_export.exe
            native-build/dotm_dx11_mesh_viewer.exe
            native-build/dotm_pe_probe
            native-build/dotm_pe_probe.exe
          if-no-files-found: error
